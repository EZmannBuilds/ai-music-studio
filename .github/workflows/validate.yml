name: validate

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # PyYAML is optional: schema_check.py skips its parse step without it and
      # every other check runs on a bare Python 3.
      - run: pip install pyyaml
      - run: python3 tools/check_all.py
