diversity_comparison:
  rows_compared: ["Track A", "Track B"]
  shared_dimensions:
    - tempo_family
    - meter
    - harmonic_mechanism
    - bass_role
    - form
    - section_lengths
    - chorus_lift_mechanism
    - transition_grammar
    - vocal_architecture
    - outro_behavior
  distinct_dimensions: []
  classification:
    bass_role: convention
    subdivision: convention
    transition_grammar: accidental
    chorus_lift_mechanism: accidental
    form: motif
    vocal_architecture: accidental
  unclassified: []
  question_for_user: >
    Both tracks so far are mid-tempo 4/4, verse/pre/chorus, sub-bass anchored, with the chorus
    lifted by width and a doubled final chorus that fades, and the same vocal stack in both.
    Is that this EP's identity, or is it the shape everything is coming out in?
  status: ask

# What the answer produced, recorded so the question is not asked again:
user_answer: >
  The form and the sub-bass are the record. The riser-silence-impact and the identical chorus
  stack are not deliberate.

action_taken:
  recorded_as_project_motif: [form, bass_role]
  routed_to_creative_lab:
    stale_dimensions: [transition_grammar, chorus_lift_mechanism, vocal_architecture]
    note: >
      The Lab is told which dimensions are stale, so its candidates for Track C break those
      specifically rather than differing at random.
