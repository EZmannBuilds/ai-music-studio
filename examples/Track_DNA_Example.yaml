# Three ledger rows and the comparison between them.
# Schema: shared/TRACK_DIVERSITY_LEDGER.md (track_dna, section 3; comparison, section 4) and
# shared/VOCAL_ARCHITECTURE_SCHEMA.md section 3 for the vocal sub-record.
# The point of this example is the classification step: a shared dimension is a question, not a
# defect, and the answer is recorded so it is not asked again.
# "Shared" means three or more of the compared rows agree (section 4), so the example compares three.
# Fields left null are "not decided here" and are not compared.

