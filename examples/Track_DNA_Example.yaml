diversity_comparison:
  rows_compared: ["Track A", "Track B", "Track C"]
  # every dimension where all three rows agree
  shared_dimensions:
    - tempo_family
    - meter
    - tonal_center_strategy
    - harmonic_mechanism
    - bass_role
    - subdivision
    - form
    - lead_source
    - lift_mechanism
    - arrangement_curve
    - transition_grammar
    - vocal_architecture
    - outro_behavior
  distinct_dimensions:
    - pitch_system
    - harmonic_rhythm
    - groove_family
    - section_lengths
    - hook_type
    - production_density
    - texture_family
    - dynamic_shape
    - performer_character
  # already explained before this comparison: the genre's conventions, recorded earlier
  classification:
    tempo_family: convention
    meter: convention
    tonal_center_strategy: convention
    subdivision: convention
    lead_source: convention
  unclassified:
    - harmonic_mechanism
    - bass_role
    - form
    - lift_mechanism
    - arrangement_curve
    - transition_grammar
    - vocal_architecture
    - outro_behavior
  question_for_user: >
    All three tracks so far are modal vamps in verse/pre/chorus, sub-bass anchored, rising to a
    chorus lifted by width, with the same riser-silence-impact transitions, the same vocal stack and
    a doubled final chorus that fades. Is that this EP's identity, or is it the shape everything is
    coming out in?
  status: ask

# What the answer produced, recorded so the question is not asked again:
user_answer: >
  The form and the sub-bass are the record, and the modal vamp and the rising curve are just the
  genre. The riser-silence-impact, the width lift, the identical chorus stack and the fade are not
  deliberate.

action_taken:
  recorded_as_project_motif: [form, bass_role]
  recorded_as_convention: [harmonic_mechanism, arrangement_curve]
  routed_to_creative_lab:
    stale_dimensions: [transition_grammar, lift_mechanism, vocal_architecture, outro_behavior]
    note: >
      The Lab is told which dimensions are stale, so its candidates for Track D break those
      specifically rather than differing at random.
