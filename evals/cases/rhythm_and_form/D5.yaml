# Evaluation case D5. Format: evals/schemas/CASE_SCHEMA.md
test:
  id: D5
  title: Percussion only
  category: rhythm_and_form
  source: research/BENCHMARK_DIVERSITY.md D5
  brief: A complete piece with no pitched material at all.
  supplied_context: []
  expected_routes:
    must_include: []
    must_not_include: []
  required_behaviors:
  - form, development, tension and hook without melody or harmony
  forbidden_behaviors:
  - pitched material sneaking in
  structural_assertions:
  - id: trace_present
    why: routing and preservation are checked from the trace
    block_present: session_trace
  - id: no_chords
    regex_absent:
      pattern: \b[A-G][#b♯♭]?(?:m|maj7|m7|7|sus[24]|dim|aug)?\s*(?:[-–|>]|→)\s*[A-G][#b♯♭]?(?:m|maj7|m7|7|sus[24]|dim|aug)?\s*(?:[-–|>]|→)\s*[A-G]
      in: prose
      ignore_case: false
  human_questions:
  - Does it have a hook and a shape without any pitch?
  trials: 3
