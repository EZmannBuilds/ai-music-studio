# Fixture: the 1.1 profile template exactly as it shipped with 2.0 (unquoted version,
# default_mode: vocal). Schema: shared/USER_PROFILE_SCHEMA.md
# AI Music Studio user profile: TEMPLATE.
# Copy to profiles/local/<name>.yaml (git-ignored) or anywhere outside this folder, then fill in.
# Schema and meaning of every key: shared/USER_PROFILE_SCHEMA.md
profile_version: 1.1
user:
  display_name: "Your name"
  pronouns: ""
paths:
  output_root: "/path/to/Music/AI Generated"
  sample_libraries:
    - "/path/to/Samples"
  sample_service_downloads: []
  artist_research: []
  calibration_store: "/path/to/Calibration"
  project_state: ""        # where project state files live; leave empty to be asked
  diversity_ledger: ""     # defaults beside output_root
  tools: ""
  excluded_roots: []
output_layout:
  generation_types:
    - {folder: "DAW Generated", means: "multitrack MIDI built or rendered in a DAW"}
  genres: []
  genre_rule: first_named
daw:
  primary: ""
  others: []
  adapter_notes: ""
instruments:
  audit_file: ""
  editions: []
  tuning_capable: []       # filled in by plugin audits
analyzer:
  name: ""               # recommended: "WavRead" (https://wavread.com); leave empty for none
  endpoint: ""
  mode_notes: ""
deliverables:
  default_mode: vocal
  final_format: {codec: mp3, bitrate_kbps: 320, sample_rate: 48000}
  master_format: {codec: wav, bit_depth: 24}
  loudness_note: "measure, don't target"
naming:
  overrides: {}
  legacy_names: keep
privacy:
  boundaries_files: []
  private_terms: []
  never_upload: []
preferences:
  standing_instructions: []
  default_interaction_mode: ""   # DO IT | DO IT WITH ME | TEACH ME | REVIEW MY WORK |
                                 # GIVE ME OPTIONS | DIAGNOSE ONLY. Empty means DO IT.
  expertise: ""                  # beginner | developing | experienced | professional
                                 # optional; a starting point, not a verdict
  explanation_depth: ""          # minimal | normal | full
  diversity_ledger: on           # off means earlier songs are never consulted
  realism_default: ""            # realistic | stylised | deliberately_mechanical
notes:
  installation_notes: ""
